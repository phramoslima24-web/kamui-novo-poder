name: Build Kamui Prison Addon

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (exigido pelo Forge 1.20.1)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1 (compativel com ForgeGradle 6 / Forge 1.20.1)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.1.1'

      - name: Build (compila, processa recursos e reofusca o JAR)
        run: gradle build --no-daemon --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: kamuiprison-addon-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
